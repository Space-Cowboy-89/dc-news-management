############ GENERAL PROPERTIES ############
spring.application.name=digital chronicles news management API


############ DB PROPERTIES ############

# URL di connessione al DB
spring.datasource.url=jdbc:postgresql://localhost:5432/dc_news_db

# Username e password del DB
spring.datasource.username=postgres
spring.datasource.password=beta1710

# Driver JDBC (spesso opzionale, Spring Boot lo rileva automaticamente)
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialetto Hibernate (opzionale ma consigliato per ottimizzazioni specifiche)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Strategia di creazione del DB (none, validate, update, create, create-drop)
spring.jpa.hibernate.ddl-auto=validate
# Mostra le query SQL nel log
spring.jpa.show-sql=true


spring.devtools.add-properties
spring.devtools.

#liquibase
spring.liquibase.enabled=false
